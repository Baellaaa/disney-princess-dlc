<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <title>Disney Princesses: an enchanted journey continues</title>
    <link rel="stylesheet" href="/css/dlc_gamestyle.css"> 
    <link rel="script" href="/js/dlc_gamescript.js">
</head>
<body>
    <a-scene>
        <a-assets>
            <a-asset-item id="forest" src="/assets/forest_clearing.glb"></a-asset-item>
            <a-asset-item id="raspberry_mg" src="/assets/red_berries.glb"></a-asset-item>
            <a-asset-item id="strawberry_mg" src="/assets/strawberry.glb"></a-asset-item>
        </a-assets>
        <a-entity
            gltf-model="#forest"
            position="0 0 -5"
            scale="0.5 0.5 0.5">
        </a-entity>
        
        <div class="sketchfab-embed-wrapper"> 
            <iframe title="Magnetic Berry" frameborder="0" allowfullscreen mozallowfullscreen="true" webkitallowfullscreen="true" allow="autoplay; fullscreen; xr-spatial-tracking" xr-spatial-tracking execution-while-out-of-viewport execution-while-not-rendered web-share src="https://sketchfab.com/models/c75fa1fccef44761968b9bf7f1bc753b/embed?camera=0&transparent=1"> 

            </iframe> 
                <p style="font-size: 13px; font-weight: normal; margin: 5px; color: #4A4A4A;"> 
                        <a href="https://sketchfab.com/3d-models/magnetic-berry-c75fa1fccef44761968b9bf7f1bc753b?utm_medium=embed&utm_campaign=share-popup&utm_content=c75fa1fccef44761968b9bf7f1bc753b" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;"> Magnetic Berry </a>
                     by <a href="https://sketchfab.com/srikanthsamba?utm_medium=embed&utm_campaign=share-popup&utm_content=c75fa1fccef44761968b9bf7f1bc753b" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;"> srikanthsamba </a>
                     on <a href="https://sketchfab.com?utm_medium=embed&utm_campaign=share-popup&utm_content=c75fa1fccef44761968b9bf7f1bc753b" target="_blank" rel="nofollow" style="font-weight: bold; color: #1CAAD9;"> Sketchfab</a>
                </p>
        </div>


        <a-entity 
            gltf-model="#strawberry_mg"
            position="-2 0 -3"
            scale="0.5 0.5 0.5">
        </a-entity>
        <a-sphere
            id="berry_picking_mg"
            position="3 1 -4"
            radius="1"
            color="yellow">
        </a-sphere>
        
        <a-entity
            class="creature"
            position="5 0 -10">
        </a-entity>

        <a-cylinder id="bucket" position="0 1 -5" radius="0.5" height="1" color="#8B4513"></a-cylinder>

        <a-entity
        geometry="
            primitive: torus;
            radius: 1;
            radiusTubular: 0.1;
            segmentsTubular: 12;"
            
        material="
            color:#F20670;
            roughness: 0.1;
            metalness: 0.5;"
        rotation="10 0 0"
        position="-3 1 0"
        animation="property: scale; to: 1 0.5 1; direction: alternate; dur: 2000;
        loop: true; easing: linear;">
        </a-entity>

        <a-entity
            class="spinning-wheel">
        </a-entity>

        <a-entity id="thornBridge"></a-entity>

        <a-camera
             position="0 1 4"
             cursor-visible="true"
             cursor-scale="2"
             cursor-color="#0095DD"
             cursor-opacity="0.5">
        </a-camera>
    </a-scene>
    <script>
        const scene = document.querySelector("a-scene");
        const cylinder = document.createElement("a-cylinder");
        cylinder.setAttribute("color", "#FBFF00");
        cylinder.setAttribute("height", "2");
        cylinder.setAttribute("radius", "0.75");
        cylinder.setAttribute("position", "3 1 0");
        scene.appendChild(cylinder);
        let t = 0;
        function render() {
        t += 0.01;
        requestAnimationFrame(render);
        cylinder.setAttribute("position", `3 ${Math.sin(t * 2) + 1} 0`);
        }
        render();
    </script>
</body>
</html>
