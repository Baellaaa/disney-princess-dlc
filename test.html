<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simon Says</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        .button-container {
            margin: 20px;
        }

        button {
            width: 100px;
            height: 100px;
            font-size: 2rem;
            margin: 10px;
            cursor: pointer;
        }

        .active {
            transform: scale(1.1);
            border: 4px solid gold;
        }

        #message {
            font-size: 1.5rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Simon Says</h1>

    <button id="start">Start Game</button>

    <div class="button-container">
        <button id="circle">◯</button>
        <button id="triangle">△</button>
        <button id="square">□</button>
    </div>

    <p id="message">Press Start</p>

    <script>
        const buttons = ["circle", "triangle", "square"];

        let sequence = [];
        let playerSequence = [];
        let playerTurn = false;

        const TARGET_ROUNDS = 5;

        document
            .getElementById("start")
            .addEventListener("click", startGame);

        buttons.forEach(buttonId => {
            document
                .getElementById(buttonId)
                .addEventListener("click", () => {
                    if (playerTurn) {
                        handlePlayerInput(buttonId);
                    }
                });
        });

        function startGame() {
            sequence = [];
            playerSequence = [];
            document.getElementById("message").textContent =
                "Watch carefully!";
            nextRound();
        }

        function nextRound() {

            playerTurn = false;
            playerSequence = [];

            const randomButton =
                buttons[Math.floor(Math.random() * buttons.length)];

            sequence.push(randomButton);

            if (sequence.length > TARGET_ROUNDS) {
                winGame();
                return;
            }

            playSequence();
        }

        function playSequence() {

            let index = 0;

            const interval = setInterval(() => {

                flashButton(sequence[index]);

                index++;

                if (index >= sequence.length) {

                    clearInterval(interval);

                    setTimeout(() => {

                        playerTurn = true;

                        document.getElementById("message").textContent =
                            "Your turn!";

                    }, 500);
                }

            }, 800);
        }

        function flashButton(buttonId) {

            const button =
                document.getElementById(buttonId);

            button.classList.add("active");

            setTimeout(() => {
                button.classList.remove("active");
            }, 400);
        }

        function handlePlayerInput(buttonId) {

            playerSequence.push(buttonId);

            const currentIndex =
                playerSequence.length - 1;

            if (
                playerSequence[currentIndex] !==
                sequence[currentIndex]
            ) {
                loseGame();
                return;
            }

            if (
                playerSequence.length ===
                sequence.length
            ) {

                document.getElementById("message").textContent =
                    "Correct!";

                setTimeout(nextRound, 1000);
            }
        }

        function loseGame() {

            playerTurn = false;

            document.getElementById("message").textContent =
                "Wrong button! Game Over.";
        }

        function winGame() {

            playerTurn = false;

            document.getElementById("message").textContent =
                "You win!";
        }
    </script>

</body>
</html>
